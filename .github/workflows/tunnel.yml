name: Bore Tunnel Keep-Alive

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # قطع الـ Job تلقائياً بعد 5 دقائق لكي لا يعلق
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download and run bore
        run: |
          # تحميل أداة bore مباشرة وثبيتها في ثوانٍ معدودة
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod +x bore
          
          # تشغيل التونل على البورت المطلوب ربطه (مثلاً البورت 8554 أو البورت الخاص بك)
          # استبدل 8554 بالبورت الذي تريده، و bore.pub بالعنوان
          ./bore local 8554 --to bore.pub &
          
          # إبقاء الـ Action نشطاً لفترة قصيرة لضمان استقرار الاتصال
          sleep 240
